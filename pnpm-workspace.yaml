allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

# Below the `engines` floor the install succeeds and the dev server then hangs without naming Node.
engineStrict: true

ignoredBuiltDependencies:
  - protobufjs
  - yarn

minimumReleaseAgeExclude:
  - '@laioutr-core/canonical-types'
  - '@laioutr-core/core-types'
  - '@laioutr-core/devtools'
  - '@laioutr-core/frontend-core'
  - '@laioutr-core/kit'
  - '@laioutr-core/orchestr'
  - '@laioutr-app/ui'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - json-editor-vue
  - sharp
  - unrs-resolver
  - vue-demi

# frontend-core's @unhead/schema-org brings unhead 2.1, and Nuxt's @unhead/vue would stay on 2.0. Two
# copies make every server-rendered page fail, so both resolve to one version.
overrides:
  '@unhead/vue': ^2.1.17
  unhead: ^2.1.17

# redisKeyPrefix() ships in the next core release. Remove this patch when the peer floor moves to it.
patchedDependencies:
  '@laioutr-core/orchestr@0.71.0': patches/@laioutr-core__orchestr@0.71.0.patch

shamefullyHoist: true

strictPeerDependencies: false
