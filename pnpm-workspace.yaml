allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

engineStrict: true

ignoredBuiltDependencies:
  - protobufjs
  - yarn

minimumReleaseAgeExclude:
  - '@laioutr-core/canonical-types'
  - '@laioutr-core/core-types'
  - '@laioutr-core/devtools'
  - '@laioutr-core/frontend-core'
  - '@laioutr-core/kit'
  - '@laioutr-core/orchestr'
  - '@laioutr-app/ui'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - json-editor-vue
  - sharp
  - unrs-resolver
  - vue-demi

patchedDependencies:
  '@laioutr-core/orchestr@0.71.0': patches/@laioutr-core__orchestr@0.71.0.patch

shamefullyHoist: true

strictPeerDependencies: false
